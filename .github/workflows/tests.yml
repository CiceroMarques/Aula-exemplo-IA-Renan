name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: backend
      - name: Executar testes unitários e de API
        run: npm test
        working-directory: backend

  frontend:
    name: Testes e build do front-end
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
        working-directory: frontend
      - name: Executar testes unitários e de componentes
        run: npm test
        working-directory: frontend
      - name: Validar build de produção
        run: npm run build
        working-directory: frontend
